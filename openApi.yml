openapi: "3.0.3"
info:
  version: 2.2.0
  title: Dropshipping Client API
  description: Dropshipping Client API
servers:
  - url: https://{host}/dropshipping-api/{dropshippingClientId}/2.2.0
    variables:
      host:
        default: api.kennzeichen.dev
        description: API host
      dropshippingClientId:
        default: 0
        description: The ID assigned to the dropshippingClientId upon granting access to API documentation.
paths:
  /licensePlateReservations/availabilityChecks:
    post:
      summary: Check if a license plate (number) is available for reservation
      operationId: LicensePlateReservationAvailabilityCheck
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicensePlateReservationAvailabilityCheckRequest"
            example:
              {
                "registrationOfficeServiceId": 1,
                "licensePlateNumberPatternComponents": {
                  "city": "AB",
                  "middle": "CD",
                  "end": "12?"
                },
                "licensePlateType": "REGULAR_SEASON",
                "vehicleType": "CAR",
                "seasonStartMonth": 4,
                "seasonEndMonth": 10
              }
      responses:
        '200':
          description: License plate number availability check results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensePlateReservationAvailabilityCheckResponse"
              example:
                {
                  "availableLicensePlateNumbers": [
                    {
                      "usageType": "EURO",
                      "city": "AB",
                      "middle": "CD",
                      "end": "123"
                    },
                    {
                      "usageType": "EURO",
                      "city": "AB",
                      "middle": "CD",
                      "end": "124"
                    }
                  ]
                }
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        '503':
          description: The service of the registration office for the given registrationOfficeServiceId is unavailable at the moment. Other services might still work. 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /licensePlateReservations/reservations:
    post:
      summary: Request a license plate (number) reservation
      operationId: LicensePlateReservation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LicensePlateReservationRequest"
            example:
              {
                "externalOrderId": "dropshipping-api-reservation",
                "email": "dropshipping-api-end-customer@localhost.test",
                "customization": {
                  "registrationOfficeServiceId": 1,
                  "licensePlateNumberComponents": {
                    "usageType": "EURO",
                    "city": "AB",
                    "middle": "CD",
                    "end": "123"
                  },
                  "licensePlateType": "REGULAR_SEASON",
                  "vehicleType": "CAR",
                  "seasonStartMonth": 4,
                  "seasonEndMonth": 10
                },
                "vehicleHolder" : {
                  "address": {
                    "additionalField": "Iadditional",
                    "firstName": "Ifirst",
                    "lastName": "Ilast",
                    "gender": "FEMALE",
                    "streetName": "Istreet",
                    "houseNumber": "1I",
                    "zipCode": "22222",
                    "cityName": "Icity",
                    "taxNumber": "Itax",
                    "companyName": "Icompany",
                    "phoneNumber": "+41222222222222",
                    "countryCode": "DE"
                  },
                  "birthDate": "2000-01-31",
                  "placeOfBirth": "Bcity"
                }
              }
      responses:
        '200':
          description: Information about the objects created for processing of the reservation request. Reservation results are communicated via webhook events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicensePlateReservationResponse"
              example:
                {
                  "order": {
                    "id": 1,
                    "costNetValue": "1.23"
                  }
                }
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders:
    post:
      summary: Create an order
      operationId: OrderCreation
      requestBody:
        required: true
        content:
          application/json:
            schema: 
              $ref: "#/components/schemas/OrderCreationRequest"
            example:
              {
                "shipperName": "Shipper 1",
                "externalId": "dropshipping-api-order",
                "email": "dropshipping-api-end-customer@localhost.test",
                "deliveryAddress": {
                  "additionalField": "Dadditional",
                  "firstName": "Dfirst",
                  "lastName": "Dlast",
                  "gender": "MALE",
                  "streetName": "Dstreet",
                  "houseNumber": "1D",
                  "zipCode": "11111",
                  "cityName": "Dcity",
                  "taxNumber": "Dtax",
                  "companyName": "Dcompany",
                  "phoneNumber": "+41111111111111",
                  "countryCode": "DE"
                },
                "invoiceAddress": {
                  "additionalField": "Iadditional",
                  "firstName": "Ifirst",
                  "lastName": "Ilast",
                  "gender": "FEMALE",
                  "streetName": "Istreet",
                  "houseNumber": "1I",
                  "zipCode": "22222",
                  "cityName": "Icity",
                  "taxNumber": "Itax",
                  "companyName": "Icompany",
                  "phoneNumber": "+41222222222222",
                  "countryCode": "DE"
                },
                "items": [ {
                  "name": "item 1",
                  "quantity": 2,
                  "sku": "SKU1",
                  "customization": {
                    "productType": "OTHER"
                  },
                  "productVariantId": 1
                }, {
                  "name": "item 2",
                  "quantity": 2,
                  "sku": "SKU2",
                  "customization": {
                    "productType": "LICENSE_PLATE",
                    "licensePlateNumberComponents" : {
                      "usageType" : "EURO",
                      "city" : "KÜ",
                      "middle" : "PO",
                      "end" : "234"
                    },
                    "seasonStartMonth": 1,
                    "seasonEndMonth": 12
                  },
                  "productVariantId": 2
                } ]
              }
                
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreationResponse"
              example:
                {
                  "deliveries": [ {
                    "id": 1,
                    "items": [ {
                      "orderItemIndex": 0
                    }, {
                      "orderItemIndex": 1
                    } ]
                  } ],
                  "id": 1,
                  "costNetValue": "1.23"
                }
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/emissionStickerOrders:
    post:
      summary: Create an emission sticker order
      operationId: EmissionStickerOrderCreation
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/EmissionStickerOrderCreationRequest"
            encoding: 
              order:
                contentType: application/json
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmissionStickerOrderCreationResponse"
              example:
                {
                  "delivery": {
                    "id": 1
                  },
                  "id": 1,
                  "costNetValue": "1.23"
                }
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /orders/reshippedOrders:
    post:
      summary: Create an reshipped order for a returned delivery
      operationId: ReshippedOrderCreation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReshippedOrderCreationRequest"
            example:
              {
                "returnedDeliveryId": 1,
                "externalId": "dropshipping-api-reshipped-order",
                "deliveryAddress": {
                  "additionalField": "Dadditional",
                  "firstName": "Dfirst",
                  "lastName": "Dlast",
                  "gender": "MALE",
                  "streetName": "Dstreet",
                  "houseNumber": "1D",
                  "zipCode": "11111",
                  "cityName": "Dcity",
                  "taxNumber": "Dtax",
                  "companyName": "Dcompany",
                  "phoneNumber": "+41111111111111",
                  "countryCode": "DE"
                },
                "invoiceAddress": {
                  "additionalField": "Iadditional",
                  "firstName": "Ifirst",
                  "lastName": "Ilast",
                  "gender": "FEMALE",
                  "streetName": "Istreet",
                  "houseNumber": "1I",
                  "zipCode": "22222",
                  "cityName": "Icity",
                  "taxNumber": "Itax",
                  "companyName": "Icompany",
                  "phoneNumber": "+41222222222222",
                  "countryCode": "DE"
                }
              }
      responses:
        '201':
          description: Created order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrderCreationResponse"
              example:
                {
                  "deliveries": [ {
                    "id": 1,
                    "items": [ {
                      "orderItemIndex": 0
                    }, {
                      "orderItemIndex": 1
                    } ]
                  } ],
                  "id": 1,
                  "costNetValue": "1.23"
                }
        default:
          description: Unexpected error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    Address:
      type: object
      required:
        - firstName
        - lastName
        - gender
        - streetName
        - houseNumber
        - zipCode
        - cityName
        - countryCode
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        gender:
          $ref: '#/components/schemas/Gender'
        streetName:
          type: string
          minLength: 1
          maxLength: 100
        houseNumber:
          type: string
          minLength: 1
          maxLength: 10
        zipCode:
          type: string
          minLength: 1
          maxLength: 12
        cityName:
          type: string
          minLength: 1
          maxLength: 100
        countryCode:
          description: ISO 3166 alpha‑2 country code
          type: string
          minLength: 1
          maxLength: 2
        taxNumber:
          type: string
          nullable: true
          minLength: 1
          maxLength: 20
        companyName:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        additionalField:
          type: string
          nullable: true
          minLength: 1
          maxLength: 100
        phoneNumber:
          type: string
          nullable: true
          minLength: 1
          maxLength: 20
    EmissionStickerOrderCreationRequest:
      type: object
      required:
        - order
        - files
      properties:
        order:
          type: object
          required:
            - externalId
            - email
            - deliveryAddress
            - invoiceAddress
            - emissionSticker
          properties:
            externalId:
              description: Dropshipping client given reference to the order.
              type: string
              minLength: 1
              maxLength: 100
            email:
              type: string
              minLength: 3
              maxLength: 255
              format: email
            deliveryAddress:
              $ref: "#/components/schemas/Address"
            invoiceAddress:
              $ref: "#/components/schemas/Address"
            emissionSticker:
              type: object
              required:
                - licensePlateNumberComponents
                - electric
                - emissionKeyNumber
              properties:
                licensePlateNumberComponents:
                  $ref: '#/components/schemas/EuroLicensePlateNumberComponents'
                electric:
                  description: True for electric vehicles, false otherwise.
                  type: boolean
                emissionKeyNumber:
                  type: string
                  minLength: 1
                  maxLength: 4
            shipperName:
              description: Overrides the shipper name. Accepts only values configured during dropshipping client setup.
              type: string
              nullable: true
              minLength: 1
              maxLength: 255
          example:
            {
              "shipperName": "Shipper 1",
              "externalId": "dropshipping-api-emission-sticker-order",
              "email": "dropshipping-api-end-customer@localhost.test",
              "deliveryAddress": {
                "additionalField": "Dadditional",
                "firstName": "Dfirst",
                "lastName": "Dlast",
                "gender": "MALE",
                "streetName": "Dstreet",
                "houseNumber": "1D",
                "zipCode": "11111",
                "cityName": "Dcity",
                "taxNumber": "Dtax",
                "companyName": "Dcompany",
                "phoneNumber": "+41111111111111",
                "countryCode": "DE"
              },
              "invoiceAddress": {
                "additionalField": "Iadditional",
                "firstName": "Ifirst",
                "lastName": "Ilast",
                "gender": "FEMALE",
                "streetName": "Istreet",
                "houseNumber": "1I",
                "zipCode": "22222",
                "cityName": "Icity",
                "taxNumber": "Itax",
                "companyName": "Icompany",
                "phoneNumber": "+41222222222222",
                "countryCode": "DE"
              },
              "emissionSticker": {
                "licensePlateNumberComponents": {
                  "usageType": "EURO",
                  "city": "BO",
                  "middle": "CD",
                  "end": "123"
                },
                "electric": true,
                "emissionKeyNumber": "35A0"
              }
            }
        files:
          description: Front and back side (either in one or multiple files) of the vehicle registration certificate part 1. See the manual in dropshipping self-service GUI for valid file types and file size limits.
          type: array
          items:
            type: string
            format: binary
    EmissionStickerOrderCreationResponse:
      type: object
      required:
        - delivery
        - id
        - costNetValue
      properties:
        delivery:
          type: object
          required:
            - id
          properties:
            id:
              type: integer
              format: int64
        id:
          type: integer
          format: int64
        costNetValue:
          type: string
          description: "Order net cost value. Decimal separator: ."
          example: "1.23"
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
    EuroLicensePlateNumberComponents:
      type: object
      allOf:
        - $ref: '#/components/schemas/LicensePlateComponents'
      required:
        - city
        - middle
        - end
      properties:
        city:
          type: string
        middle:
          type: string
        end:
          type: string
      example:
        {
          "usageType": "EURO",
          "city": "AB",
          "middle": "CD",
          "end": "123"
        }
    Gender:
      type: string
      enum:
        - FEMALE
        - MALE
        - UNSPECIFIED
    LicensePlateReservationAvailabilityCheckLicensePlateNumberPatternComponents:
      required:
        - city
        - middle
        - end
      properties:
        city:
          type: string
          minLength: 1
          maxLength: 3
        middle:
          type: string
          minLength: 1
          maxLength: 2
          description: Use ? as a wildcard for a single character.
        end:
          type: string
          minLength: 1
          maxLength: 4
          description: Use ? as a wildcard for a single character.
      example:
        {
          "city": "AB",
          "middle": "CD",
          "end": "12?"
        }
    LicensePlateReservationAvailabilityCheckRequest:
      type: object
      required:
        - registrationOfficeServiceId 
        - licensePlateType
        - vehicleType
        - licensePlateNumberPatternComponents
      properties:
        registrationOfficeServiceId:
          type: integer
          format: int32
        licensePlateType:
          $ref: "#/components/schemas/LicensePlateReservationLicensePlateType"
        vehicleType:
          $ref: "#/components/schemas/LicensePlateReservationVehicleType"
        licensePlateNumberPatternComponents:
          $ref: '#/components/schemas/LicensePlateReservationAvailabilityCheckLicensePlateNumberPatternComponents'
        seasonStartMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
        seasonEndMonth:
            type: integer
            format: int32
            nullable: true
            minimum: 1
            maximum: 12      
    LicensePlateReservationAvailabilityCheckResponse:
      type: object
      required:
        - availableLicensePlateNumbers
      properties:
        availableLicensePlateNumbers:
          type: array
          items:
            $ref: '#/components/schemas/EuroLicensePlateNumberComponents'
    LicensePlateReservationLicensePlateType:
      type: string
      enum:
        - REGULAR
        - REGULAR_SEASON
        - ELECTRIC
        - ELECTRIC_SEASON
        - HISTORICAL
        - HISTORICAL_SEASON
    LicensePlateReservationVehicleType:
      type: string
      enum:
        - CAR
        - MOTORCYCLE
    ItemCustomization:
      type: object
      anyOf:
        - $ref: '#/components/schemas/LicensePlateItemCustomization'
        - $ref: '#/components/schemas/OtherItemCustomization'
      discriminator:
        propertyName: productType
        mapping:
          LICENSE_PLATE: '#/components/schemas/LicensePlateItemCustomization'
          OTHER: '#/components/schemas/OtherItemCustomization'
      required:
        - productType
      properties:
        productType:
          $ref: '#/components/schemas/ProductType'
    LicensePlateComponents:
      type: object
      anyOf:
        - $ref: '#/components/schemas/EuroLicensePlateNumberComponents'
        - $ref: '#/components/schemas/ParkingLicensePlateNumberComponents'
      discriminator:
        propertyName: usageType
        mapping:
          EURO: '#/components/schemas/EuroLicensePlateNumberComponents'
          PARKING: '#/components/schemas/ParkingLicensePlateNumberComponents'
      required:
        - usageType
      properties:
        usageType:
          $ref: '#/components/schemas/LicensePlateUsageType'
    LicensePlateItemCustomization:
      type: object
      allOf:
        - $ref: '#/components/schemas/ItemCustomization'
      required:
        - licensePlateNumberComponents
      properties:
        licensePlateNumberComponents:
          $ref: '#/components/schemas/LicensePlateComponents'
        seasonStartMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
        seasonEndMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
      example:
        {
          "licensePlateNumberComponents": {
            "usageType": "EURO",
            "city": "AB",
            "middle": "CD",
            "end": "123"
          },
          "seasonStartMonth": 4,
          "seasonEndMonth": 10
        }
    LicensePlateReservationCustomization:
      type: object
      required:
        - registrationOfficeServiceId 
        - licensePlateType
        - vehicleType
        - licensePlateNumberComponents
      properties:
        registrationOfficeServiceId:
          type: integer
          format: int32
        licensePlateType:
          $ref: "#/components/schemas/LicensePlateReservationLicensePlateType"
        vehicleType:
          $ref: "#/components/schemas/LicensePlateReservationVehicleType"
        licensePlateNumberComponents:
          $ref: '#/components/schemas/EuroLicensePlateNumberComponents'
        seasonStartMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
        seasonEndMonth:
          type: integer
          format: int32
          nullable: true
          minimum: 1
          maximum: 12
    LicensePlateReservationRequest:
      type: object
      required:
        - customization
        - email
        - vehicleHolder
      properties:
        customization:
          $ref: '#/components/schemas/LicensePlateReservationCustomization'
        email:
          type: string
          minLength: 3
          maxLength: 255
          format: email
        externalOrderId:
          description: Dropshipping client given reference to the order.
          type: string
          minLength: 1
          maxLength: 100
          nullable: true
        vehicleHolder:
          $ref: "#/components/schemas/LicensePlateReservationRequestVehicleHolder"
    LicensePlateReservationRequestVehicleHolder:
      type: object
      required:
        - address
      properties:
        address:
          $ref: "#/components/schemas/Address"
        placeOfBirth:
          type: string
          minLength: 1
          maxLength: 150
          nullable: true
        birthDate:
          $ref: "#/components/schemas/NullableLocalDate"
    
    LicensePlateReservationResponse:
      type: object
      required:
        - order
      properties:
        order:
          type: object
          required:
            - id
            - costNetValue
          properties:
            id:
              type: integer
              format: int64
            costNetValue:
              type: string
              description: "Order net cost value. Decimal separator: ."
              example: "1.23"
    LicensePlateUsageType:
      type: string
      enum:
        - EURO
        - PARKING
    NullableLocalDate:
      description: Date in ISO8601 format.
      type: string
      format: date
      example: 2000-10-31
    OrderCreationRequest:
      type: object
      required:
        - externalId
        - email
        - deliveryAddress
        - invoiceAddress
        - items
      properties:
        shipperName:
          description: Overrides the shipper name on the shipping label. Accepts only values configured during dropshipping client setup.
          type: string
          minLength: 1
          maxLength: 255
        externalId:
          description: Dropshipping client given reference to the order.
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          minLength: 3
          maxLength: 255
          format: email
        deliveryAddress:
          $ref: "#/components/schemas/Address"
        invoiceAddress:
          $ref: "#/components/schemas/Address"
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - productVariantId
              - name
              - sku
              - quantity
              - customization
            properties:
              productVariantId:
                type: integer
                format: int64
              name:
                type: string
                minLength: 1
                maxLength: 100
              sku:
                type: string
                minLength: 1
                maxLength: 20
              quantity:
                type: integer
                format: int32
                minimum: 1
              customization:
                $ref: '#/components/schemas/ItemCustomization'
    OrderCreationResponse:
      type: object
      required:
        - id
        - deliveries
        - costNetValue
      properties:
        id:
          type: integer
          format: int64
        deliveries:
          type: array
          items:
            type: object
            required:
              - id
              - items
            properties:
              id:
                type: integer
                format: int64
              items:
                type: array
                minItems: 1
                items:
                  type: object
                  required:
                    - orderItemIndex
                  properties:
                    orderItemIndex:
                      description: 0-based index representing the list position of the corresponding order item.
                      type: integer
                      format: int32
        costNetValue:
          type: string
          description: "Order net cost value. Decimal separator: ."
          example: "1.23"
    
    OtherItemCustomization:
      type: object
      allOf:
        - $ref: '#/components/schemas/ItemCustomization'
    ParkingLicensePlateNumberComponents:
      type: object
      allOf:
        - $ref: '#/components/schemas/LicensePlateComponents'
      required:
        - text
      properties:
        text:
          type: string
      example:
        {
          "usageType": "PARKING",
          "text": "MY SPOT"
        }
    ProductType:
      type: string
      enum:
        - LICENSE_PLATE
        - OTHER
    ReshippedOrderCreationRequest:
      type: object
      required:
        - externalId
        - returnedDeliveryId
        - deliveryAddress
        - invoiceAddress
      properties:
        externalId:
          type: string
          minLength: 1
          maxLength: 100
        returnedDeliveryId:
          type: integer
          format: int64
        deliveryAddress:
          $ref: "#/components/schemas/Address"
        invoiceAddress:
          $ref: "#/components/schemas/Address"
  securitySchemes:
    basicAuth:
      type: http
      scheme: basic
          
security:
  - basicAuth: []
    